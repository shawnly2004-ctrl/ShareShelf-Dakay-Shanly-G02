{% extends "base.html" %}

{% block title %}Server error | ShareShelf{% endblock %}

{% block content %}
<main class="text-center py-5" role="main">
  <p class="display-1 fw-bold text-danger mb-2">500</p>
  <h1 class="h2 mb-3">Something went wrong</h1>
  <p class="lead text-secondary mb-4">We couldn&apos;t complete your request. Please try again later.</p>
  {% if user.is_authenticated %}
    <a class="btn btn-primary" href="{% url 'dashboard' %}">Return to dashboard</a>
  {% else %}
    <a class="btn btn-primary" href="{% url 'login' %}">Go to login</a>
  {% endif %}
</main>
{% endblock %}
