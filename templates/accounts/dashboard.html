{% extends 'base.html' %}
{% block title %}Dashboard | ShareShelf{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="mb-0">Dashboard</h3>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
  </form>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <p class="mb-1">Logged in as: <strong>{{ user.email }}</strong></p>
    <p class="mb-0">Role: <strong>{{ user.role }}</strong> | Type: <strong>{{ user.user_type }}</strong></p>
  </div>
</div>
{% endblock %}
