{% extends "base.html" %}

{% block title %}Page not found | ShareShelf{% endblock %}

{% block content %}
<main class="text-center py-5" role="main">
  <p class="display-1 fw-bold text-primary mb-2">404</p>
  <h1 class="h2 mb-3">Page not found</h1>
  <p class="lead text-secondary mb-4">The page you&apos;re looking for doesn&apos;t exist or may have moved.</p>
  {% if user.is_authenticated %}
    <a class="btn btn-primary" href="{% url 'dashboard' %}">Return to dashboard</a>
  {% else %}
    <a class="btn btn-primary" href="{% url 'login' %}">Go to login</a>
  {% endif %}
</main>
{% endblock %}
